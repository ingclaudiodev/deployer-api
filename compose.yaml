# Entorno local de deployer-api: Octane (Swoole) + Horizon + scheduler + Reverb + Redis.
#
#   docker compose up -d --build
#   docker compose exec app php artisan octane:reload   # tras cambiar código PHP
#
# La base de datos NO corre en compose: la app se conecta con los DB_* del .env, salvo DB_HOST,
# que aquí se fija en host.docker.internal para llegar al Postgres de la máquina anfitriona
# (dentro de un contenedor 127.0.0.1 es el propio contenedor).
# REDIS_HOST y REVERB_HOST se sobreescriben para apuntar a los servicios redis y reverb de
# compose (así app y horizon publican los eventos dentro de la red de Docker); el navegador
# sigue entrando por localhost:${REVERB_PORT}, que es el puerto publicado del servicio reverb.

name: deployer

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dev
  image: deployer-api:dev
  env_file: .env
  environment:
    DB_HOST: host.docker.internal
    REDIS_HOST: redis
    REVERB_HOST: reverb
    REVERB_SCHEME: http
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
  volumes:
    - .:/var/www/html
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    command: octane
    ports:
      - "${APP_PORT:-8000}:8000"

  horizon:
    <<: *app
    command: horizon
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  scheduler:
    <<: *app
    command: scheduler
    healthcheck:
      disable: true

  reverb:
    <<: *app
    command: reverb
    ports:
      - "${REVERB_PORT:-6001}:${REVERB_SERVER_PORT:-6001}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${REVERB_SERVER_PORT:-6001}/up"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
