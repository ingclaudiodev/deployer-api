; Octane corre bajo php-cli: estas directivas aplican al servidor Swoole.
; Los valores ${...} se leen del entorno (ENV del Dockerfile / compose).

; Swoole necesita las variables de entorno en $_ENV/$_SERVER.
variables_order = EGPCS

memory_limit = ${PHP_MEMORY_LIMIT}
post_max_size = 64M
upload_max_filesize = 64M
expose_php = Off
date.timezone = UTC
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; 1 en desarrollo (código montado desde el host), 0 en producción.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
