# El 2026-11-10 el autoscaler apagó el nodo del pod del túnel ("deleting pod for node scale down"):
# el pod renació en otro nodo pero el balanceador tardó ~2 min en dar por sano el NEG nuevo y
# mientras tanto el cliente del Mac no podía conectar => la API dio "connection refused" a la BD.
# minAvailable 1 con una sola réplica: ninguna desalojo VOLUNTARIO (scale down, drenaje) puede
# matar el pod; junto con la anotación safe-to-evict=false del Deployment. Una rotación del
# Deployment (Recreate) sigue siendo posible: es un cambio nuestro, no un desalojo.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: db-tunnel
  namespace: deployer-api
  labels:
    app.kubernetes.io/name: db-tunnel
    app.kubernetes.io/part-of: deployer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-tunnel
