# PLANTILLA: NO aplicar tal cual ni commitear valores reales. Secret del servidor chisel del túnel.
#   users.json: usuarios chisel y los remotos que cada uno puede abrir. Solo se permite el reverse
#               remote R:0.0.0.0:5432 (publicar el Postgres del Mac); con "" el cliente podría
#               abrir cualquier puerto del clúster desde el Mac (Redis, etc.).
#   key:        clave SSH del servidor (chisel server --keygen -). Fija => la huella (fingerprint)
#               que el cliente del Mac pinea con --fingerprint no cambia al rotar el pod.
# Crear/rotar (los mismos valores van en ~/.config/deployer-db-tunnel/env del Mac):
#   ~/.local/bin/chisel server --keygen /tmp/chisel.key
#   printf '{"deployer-mac:<password>": ["^R:0\\\\.0\\\\.0\\\\.0:5432$"]}' > /tmp/users.json
#   kubectl -n deployer-api create secret generic db-tunnel-auth \
#     --from-file=users.json=/tmp/users.json --from-file=key=/tmp/chisel.key \
#     --dry-run=client -o yaml | kubectl apply -f -   && rm /tmp/chisel.key /tmp/users.json
# La huella se lee del log del pod al arrancar: kubectl -n deployer-api logs deploy/db-tunnel | grep Fingerprint
apiVersion: v1
kind: Secret
metadata:
  name: db-tunnel-auth
  namespace: deployer-api
type: Opaque
stringData:
  users.json: '{"deployer-mac:CHANGE-ME": ["^R:0\\.0\\.0\\.0:5432$"]}'
  key: ck-CHANGE-ME
