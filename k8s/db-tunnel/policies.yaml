# Lo que el Gateway necesita en este namespace para servir https://db-tunnel.deployer.cl DIRECTO
# al Service db-tunnel (sin HAProxy: cada rotación de HAProxy cortaría el WebSocket del túnel).
# Mismo patrón que reverb/policies.yaml; la HTTPRoute vive en cluster-deployer/gateway/routes/.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: httproutes-haproxy-a-db-tunnel
  namespace: deployer-api
  labels:
    app.kubernetes.io/name: db-tunnel
    app.kubernetes.io/part-of: deployer
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: haproxy
  to:
    - group: ""
      kind: Service
      name: db-tunnel
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: db-tunnel
  namespace: deployer-api
  labels:
    app.kubernetes.io/name: db-tunnel
    app.kubernetes.io/part-of: deployer
spec:
  default:
    # El túnel es UN WebSocket de larga vida: timeoutSec es su vida máxima (24 h, el tope del
    # balanceador). Al cumplirse, el balanceador lo cierra y el cliente del Mac reconecta solo
    # (max-retry-count -1): un corte de segundos una vez al día.
    timeoutSec: 86400
    connectionDraining:
      drainingTimeoutSec: 30
    logging:
      enabled: true
      sampleRate: 1000000
  targetRef:
    group: ""
    kind: Service
    name: db-tunnel
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: db-tunnel
  namespace: deployer-api
  labels:
    app.kubernetes.io/name: db-tunnel
    app.kubernetes.io/part-of: deployer
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        # chisel responde GET /health -> 200 "OK"; GET / es 404 (quedaría UNHEALTHY sin esto).
        portSpecification: USE_SERVING_PORT
        requestPath: /health
  targetRef:
    group: ""
    kind: Service
    name: db-tunnel
