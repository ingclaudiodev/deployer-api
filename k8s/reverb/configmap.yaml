# Configuración NO secreta de Reverb (lo secreto: Secret compartido deployer-api-secrets, k8s/base). La imagen es la misma de la API (docker/Dockerfile) y el
# entrypoint arranca `reverb:start` con REVERB_SERVER_HOST/PORT. El resto del .env que la app
# necesita (DB, Redis, Passport...) vendrá con los manifiestos de app/horizon; Reverb solo
# necesita bootear Laravel, de ahí el mínimo de abajo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reverb-config
  namespace: deployer-api
  labels:
    app.kubernetes.io/name: reverb
    app.kubernetes.io/part-of: deployer
data:
  APP_NAME: deployer.cl
  APP_ENV: production
  APP_DEBUG: "false"
  APP_LOCALE: es
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  BROADCAST_CONNECTION: reverb
  # Dónde escucha el proceso dentro del pod.
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "6001"
  # Hostname público que anuncia el servidor (el de la HTTPRoute ws.deployer.cl del clúster).
  REVERB_HOST: ws.deployer.cl
  REVERB_PORT: "443"
  REVERB_SCHEME: https
  # Con más de una réplica cada pod ve solo sus propios sockets: Redis los sincroniza.
  # Dejar "true" antes de subir `replicas`; REDIS_HOST ya apunta al Redis compartido del cluster.
  REVERB_SCALING_ENABLED: "false"
  REDIS_HOST: redis.redis.svc.cluster.local
  REDIS_PORT: "6379"
  # Reverb no usa DB ni colas, pero Laravel exige un driver para bootear.
  DB_CONNECTION: sqlite
  DB_DATABASE: /tmp/reverb.sqlite
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
