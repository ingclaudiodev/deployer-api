# Namespace de la API de Deployer en deployer-cluster (GKE Autopilot). Aquí viven app (Octane),
# horizon, scheduler, reverb y redis. Se aplica UNA vez desde k8s/base (ya no desde k8s/reverb).
apiVersion: v1
kind: Namespace
metadata:
  name: deployer-api
  labels:
    app.kubernetes.io/part-of: deployer
    # Sin etiqueta default-compute-class desde el 2026-11-10: los pods van a la clase Autopilot
    # general (cobro por pod, nodo ek con pd-balanced). Antes iban a la ComputeClass n4-hyperdisk
    # de cluster-deployer, que se cobraba por nodo en Compute Engine (~US$245/mes con 4 nodos).
    # Redis no vive aquí: es el compartido del cluster (cluster-deployer/redis, ns redis).
