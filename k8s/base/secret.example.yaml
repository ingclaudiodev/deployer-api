# PLANTILLA: NO aplicar tal cual ni commitear valores reales. Un solo Secret para app, horizon,
# scheduler, migrate y reverb (todos leen REVERB_APP_* de aquí: así nunca se desincronizan).
#
# Crear (desde la raíz de deployer-api):
#   php artisan passport:keys --no-interaction            # si aún no existen storage/oauth-*.key
#   kubectl -n deployer-api create secret generic deployer-api-secrets \
#     --from-literal=APP_KEY="$(php artisan key:generate --show)" \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=REVERB_APP_ID='...' --from-literal=REVERB_APP_KEY='...' --from-literal=REVERB_APP_SECRET='...' \
#     --from-file=PASSPORT_PRIVATE_KEY=storage/oauth-private.key \
#     --from-file=PASSPORT_PUBLIC_KEY=storage/oauth-public.key \
#     --from-literal=LOG_SLACK_WEBHOOK_URL='' --from-literal=SLACK_WEBHOOK_URL='' \
#     --from-literal=MAIL_USERNAME='' --from-literal=MAIL_PASSWORD=''
#
# Las claves PEM van con --from-file (con --from-literal se pierden los saltos de línea y
# Passport no las lee). REVERB_APP_KEY es además la clave pública que recibe el frontend
# (../deployer/.env.yaml). Rotar APP_KEY invalida sesiones y datos cifrados; rotar las claves
# de Passport invalida todos los tokens emitidos.
#
# Actualizar un valor: kubectl -n deployer-api create secret generic deployer-api-secrets ... \
#   --dry-run=client -o yaml | kubectl apply -f -   y luego rollout restart de app/horizon/reverb.
apiVersion: v1
kind: Secret
metadata:
  name: deployer-api-secrets
  namespace: deployer-api
type: Opaque
stringData:
  APP_KEY: base64:CHANGE-ME
  DB_PASSWORD: CHANGE-ME
  REVERB_APP_ID: CHANGE-ME
  REVERB_APP_KEY: CHANGE-ME
  REVERB_APP_SECRET: CHANGE-ME
  PASSPORT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    CHANGE-ME
    -----END PRIVATE KEY-----
  PASSPORT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    CHANGE-ME
    -----END PUBLIC KEY-----
  LOG_SLACK_WEBHOOK_URL: ""
  SLACK_WEBHOOK_URL: ""
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
